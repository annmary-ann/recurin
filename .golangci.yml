# golangci-lint v2 configuration. Run with `make lint`.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint # wrap and compare errors correctly
    - exhaustive # every enum value handled in a switch (state machines!)
    - gocritic
    - gosec
    - misspell
    - noctx # HTTP and SQL calls must take a context
    - nolintlint # every //nolint has a reason
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: indent-error-flow
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may ignore errors from deferred cleanup and use test-only shortcuts.
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/annmary-ann/recurin
